<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSINT Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0c0c0c;
      --bg-elevated: #161616;
      --bg-card: #1a1a1a;
      --bg-card-hover: #222;
      --border: #2a2a2a;
      --border-light: #333;
      --text: #eaeaea;
      --text-dim: #888;
      --text-muted: #666;
      --green: #00d47b;
      --green-dim: rgba(0,212,123,0.12);
      --red: #ff4d4d;
      --red-dim: rgba(255,77,77,0.12);
      --yellow: #ffb800;
      --yellow-dim: rgba(255,184,0,0.12);
      --blue: #4d9fff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Header ---- */
    .header {
      padding: 48px 24px 36px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 4px;
    }

    .header h1 span { color: var(--green); }

    .header p {
      color: var(--text-dim);
      font-size: 0.875rem;
    }

    /* ---- Search ---- */
    .search-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 24px 24px 0;
      flex-wrap: wrap;
    }

    .search-bar input {
      width: 420px;
      max-width: 100%;
      padding: 12px 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus { border-color: var(--green); }
    .search-bar input::placeholder { color: var(--text-muted); }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-go { background: var(--green); color: #000; }
    .btn-export { background: var(--bg-elevated); color: var(--text); border: 1px solid var(--border); }

    /* ---- Status ---- */
    .status { text-align: center; padding: 20px; display: none; color: var(--text-dim); font-size: 0.9rem; }
    .status.on { display: block; }

    .loader {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border-light);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .track {
      width: 240px; height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin: 10px auto 0;
      overflow: hidden;
    }

    .track-fill {
      height: 100%;
      background: var(--green);
      border-radius: 2px;
      width: 0%;
      transition: width 0.4s;
    }

    /* ---- Container ---- */
    .wrap { max-width: 1360px; margin: 0 auto; padding: 24px; }

    /* ---- Results header ---- */
    .results-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .results-bar h2 { font-size: 1.1rem; font-weight: 600; }

    .meta { font-size: 0.8rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

    /* ---- Cards ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 12px;
      margin-bottom: 36px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .card:hover { border-color: var(--border-light); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .card-top h3 {
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .pill {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pill-ok { background: var(--green-dim); color: var(--green); }
    .pill-err { background: var(--red-dim); color: var(--red); }
    .pill-warn { background: var(--yellow-dim); color: var(--yellow); }

    .card-body { padding: 10px 16px 14px; }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.8rem;
      gap: 12px;
    }

    .row:last-child { border-bottom: none; }

    .row-k { color: var(--text-muted); flex-shrink: 0; font-weight: 500; }
    .row-v { text-align: right; word-break: break-all; color: var(--text-dim); max-width: 65%; }

    /* ---- Comparison ---- */
    .comp { margin-top: 36px; }
    .comp h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }

    .tbl-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }

    thead th {
      background: var(--bg-elevated);
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tbody td {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-dim);
    }

    tbody tr:hover { background: var(--bg-card-hover); }

    /* ---- Footer ---- */
    .foot {
      text-align: center;
      padding: 28px 24px;
      border-top: 1px solid var(--border);
      margin-top: 48px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .foot a { color: var(--green); text-decoration: none; }
    .foot a:hover { text-decoration: underline; }

    .tools-list {
      margin-top: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      .search-bar input { width: 100%; }
      .header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>OSINT<span>.</span>platform</h1>
    <p>Analyze any website with 13 open-source intelligence APIs</p>
  </div>

  <div class="search-bar">
    <input type="text" id="targetInput" placeholder="enter domain or IP..." />
    <button class="btn btn-go" id="analyzeBtn" onclick="startAnalysis()">Analyze</button>
    <button class="btn btn-export" id="exportBtn" onclick="exportToExcel()" disabled>Export .xlsx</button>
  </div>

  <div class="status" id="statusBar">
    <span class="loader"></span>
    <span id="statusText">Querying OSINT engines...</span>
    <div class="track"><div class="track-fill" id="progressFill"></div></div>
  </div>

  <div class="wrap" id="resultsArea" style="display:none;">
    <div class="results-bar">
      <h2>Results</h2>
      <div class="meta">
        <span id="resultTarget"></span> &middot; <span id="resultTime"></span>
      </div>
    </div>

    <div class="grid" id="cardsGrid"></div>

    <div class="comp">
      <h2>Comparison</h2>
      <div class="tbl-wrap">
        <table id="comparisonTable">
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="foot">
    <p>Built by <a href="https://khubabahmed.com" target="_blank">Khubab Ahmed</a></p>
    <p class="tools-list">VirusTotal, Shodan, IPinfo, AbuseIPDB, URLScan.io, AlienVault OTX, GreyNoise, HackerTarget, ViewDNS, DNSdumpster, ipapi.co, LeakIX, Pulsedive</p>
  </div>

  <script>
    let analysisData = null;

    function showStatus(msg) {
      document.getElementById('statusBar').classList.add('on');
      document.getElementById('statusText').textContent = msg;
    }

    function hideStatus() { document.getElementById('statusBar').classList.remove('on'); }

    function setProgress(pct) { document.getElementById('progressFill').style.width = pct + '%'; }

    async function startAnalysis() {
      const target = document.getElementById('targetInput').value.trim();
      if (!target) { alert('Enter a domain or IP'); return; }

      const btn = document.getElementById('analyzeBtn');
      btn.disabled = true;
      btn.textContent = 'Scanning...';
      document.getElementById('exportBtn').disabled = true;
      document.getElementById('resultsArea').style.display = 'none';

      showStatus('Querying OSINT engines...');
      setProgress(10);

      try {
        const tick = setInterval(() => {
          const el = document.getElementById('progressFill');
          const w = parseFloat(el.style.width);
          if (w < 85) el.style.width = (w + Math.random() * 8) + '%';
        }, 1500);

        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ target })
        });

        clearInterval(tick);
        setProgress(100);

        if (!res.ok) throw new Error('Analysis failed');

        analysisData = await res.json();
        showStatus('Done');
        setTimeout(hideStatus, 1000);
        renderResults(analysisData);
        document.getElementById('exportBtn').disabled = false;
      } catch (err) {
        hideStatus();
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Analyze';
      }
    }

    function renderResults(data) {
      document.getElementById('resultsArea').style.display = 'block';
      document.getElementById('resultTarget').textContent = data.target;
      document.getElementById('resultTime').textContent = new Date(data.timestamp).toLocaleString();

      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      data.results.forEach(r => {
        const card = document.createElement('div');
        card.className = 'card';

        let pillClass = 'pill-ok', pillText = 'ok';
        if (r.status === 'error') { pillClass = 'pill-err'; pillText = 'err'; }
        if (r.status === 'no_key') { pillClass = 'pill-warn'; pillText = 'no key'; }

        let body = '';
        if (r.data) {
          Object.entries(r.data).forEach(([k, v]) => {
            const label = k.replace(/_/g, ' ');
            const val = typeof v === 'object' ? JSON.stringify(v) : String(v);
            body += `<div class="row"><span class="row-k">${label}</span><span class="row-v">${val}</span></div>`;
          });
        } else if (r.error) {
          body = `<div class="row"><span class="row-k">error</span><span class="row-v" style="color:var(--red)">${r.error}</span></div>`;
        } else {
          body = `<div class="row"><span class="row-k">info</span><span class="row-v">API key not configured</span></div>`;
        }

        card.innerHTML = `<div class="card-top"><h3>${r.tool}</h3><span class="pill ${pillClass}">${pillText}</span></div><div class="card-body">${body}</div>`;
        grid.appendChild(card);
      });

      renderComparisonTable(data);
    }

    function renderComparisonTable(data) {
      const thead = document.getElementById('tableHead');
      const tbody = document.getElementById('tableBody');
      thead.innerHTML = '<th>field</th>';
      tbody.innerHTML = '';

      const ok = data.results.filter(r => r.status === 'success' && r.data);
      ok.forEach(r => { thead.innerHTML += `<th>${r.tool}</th>`; });

      const keys = new Set();
      ok.forEach(r => { if (r.data) Object.keys(r.data).forEach(k => keys.add(k)); });

      const priority = ['ip','ip_address','country','country_code','city','region','organization','org','isp','domain','hostname','asn','reputation','abuse_confidence_score','open_ports','server','registrar'];
      const ordered = [...priority.filter(k => keys.has(k)), ...[...keys].filter(k => !priority.includes(k))];

      ordered.forEach(key => {
        const label = key.replace(/_/g, ' ');
        let row = `<tr><td><strong>${label}</strong></td>`;
        ok.forEach(r => {
          const v = r.data?.[key];
          const d = v === undefined ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
          row += `<td>${d}</td>`;
        });
        tbody.innerHTML += row + '</tr>';
      });
    }

    function exportToExcel() {
      if (!analysisData) return;
      const wb = XLSX.utils.book_new();

      const ok = analysisData.results.filter(r => r.status === 'success' && r.data);
      const hdr = ['Data Field', ...ok.map(r => r.tool)];
      const rows = [hdr];
      const keys = new Set();
      ok.forEach(r => { if (r.data) Object.keys(r.data).forEach(k => keys.add(k)); });
      [...keys].forEach(k => {
        const label = k.replace(/_/g, ' ');
        const row = [label];
        ok.forEach(r => {
          const v = r.data?.[k];
          row.push(v === undefined ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v)));
        });
        rows.push(row);
      });
      const ws1 = XLSX.utils.aoa_to_sheet(rows);
      ws1['!cols'] = hdr.map(() => ({ wch: 25 }));
      XLSX.utils.book_append_sheet(wb, ws1, 'Comparison');

      analysisData.results.forEach(r => {
        const d = [['Field', 'Value'], ['Tool', r.tool], ['Status', r.status]];
        if (r.data) Object.entries(r.data).forEach(([k, v]) => d.push([k, typeof v === 'object' ? JSON.stringify(v) : String(v)]));
        if (r.error) d.push(['Error', r.error]);
        const ws = XLSX.utils.aoa_to_sheet(d);
        ws['!cols'] = [{ wch: 25 }, { wch: 50 }];
        XLSX.utils.book_append_sheet(wb, ws, r.tool.substring(0, 31));
      });

      const sum = [
        ['OSINT Analysis Report'], [''],
        ['Target', analysisData.target],
        ['Scan Time', analysisData.timestamp],
        ['Total Tools', analysisData.results.length],
        ['Successful', analysisData.results.filter(r => r.status === 'success').length],
        ['Failed', analysisData.results.filter(r => r.status === 'error').length],
        [''], ['Tools'], ...analysisData.results.map(r => [r.tool, r.status])
      ];
      const ws3 = XLSX.utils.aoa_to_sheet(sum);
      ws3['!cols'] = [{ wch: 20 }, { wch: 40 }];
      XLSX.utils.book_append_sheet(wb, ws3, 'Summary');

      XLSX.writeFile(wb, `OSINT_${analysisData.target}_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    document.getElementById('targetInput').addEventListener('keypress', e => { if (e.key === 'Enter') startAnalysis(); });
  </script>
</body>
</html>
